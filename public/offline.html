<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Offline — Road Rescue</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8f8f8;
        --fg: #111111;
        --muted: #666666;
        --card: #ffffff;
        --primary: #ffd100;
        --border: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0d0d;
          --fg: #f2f2f2;
          --muted: #9a9a9a;
          --card: #171717;
          --border: #2a2a2a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: #111111;
        display: grid;
        place-items: center;
      }
      .mark svg { width: 30px; height: 30px; }
      h1 { margin: 0 0 8px; font-size: 1.35rem; }
      p { margin: 0 0 12px; color: var(--muted); line-height: 1.5; font-size: 0.95rem; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0 20px;
        padding: 6px 12px;
        border-radius: 999px;
        background: color-mix(in srgb, #ef4444 12%, transparent);
        color: #b91c1c;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: #111111;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 12px 18px;
        width: 100%;
        cursor: pointer;
      }
      .note {
        margin-top: 14px;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFD100" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
          <path d="m4.9 4.9 2.8 2.8M16.3 16.3l2.8 2.8M16.3 7.7l2.8-2.8M4.9 19.1l2.8-2.8"/>
        </svg>
      </div>
      <h1>You're currently offline</h1>
      <p>
        Road Rescue needs an internet connection for rescue requests, live tracking,
        payments, and mechanic assignment.
      </p>
      <div class="status" id="status">
        <span class="dot" aria-hidden="true"></span>
        <span>No connection</span>
      </div>
      <button type="button" id="retry">Retry connection</button>
      <p class="note">Emergency roadside help is not available offline.</p>
    </main>
    <script>
      const status = document.getElementById('status');
      const retry = document.getElementById('retry');
      function sync() {
        if (navigator.onLine) {
          status.innerHTML = '<span class="dot" style="background:#16a34a"></span><span style="color:#15803d">Back online — reloading…</span>';
          location.replace('/');
        }
      }
      retry.addEventListener('click', () => {
        if (navigator.onLine) location.replace('/');
        else status.querySelector('span:last-child').textContent = 'Still offline — check your connection';
      });
      window.addEventListener('online', sync);
      sync();
    </script>
  </body>
</html>
